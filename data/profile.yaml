    name: "Anthropic"
    topic: "AI safety Claude"
  - handle: "OpenAI"
    name: "OpenAI"
    topic: "AI models"
  - handle: "garrytan"
    name: "Garry Tan"
    topic: "startup YC"
  - handle: "swyx"
    name: "swyx"
