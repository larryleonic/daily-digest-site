# Daily Digest — 用户兴趣画像 (v4 全信源)
# 核心理念：信源质量 > 内容数量，0-hop > N-hop

interests:
  - label: "科技/AI"
    keywords: ["AI", "LLM", "GPT", "Claude", "产品发布", "开源", "机器学习", "deep learning", "AGI", "Agent", "RAG", "多模态", "transformer", "reasoning", "scaling"]
    weight: 0.9
    tone: "有趣 > 硬核"
  - label: "投资/经济"
    keywords: ["量化", "量化交易", "投资入门", "经济学", "自由职业", "理财", "股票", "crypto", "fintech", "indie hacker", "FIRE", "passive income"]
    weight: 0.7
  - label: "英雄联盟"
    keywords: ["patch notes", "meta", "champion", "LoL", "League of Legends", "英雄联盟"]
    weight: 0.6
  - label: "社会观察/纪录片"
    keywords: ["纪录片", "社会现象", "采访", "documentary", "人文", "社会学", "真实故事"]
    weight: 0.6
  - label: "历史/哲学"
    keywords: ["历史洞见", "哲学思想", "尼采", "黑格尔", "庄子", "周易", "历史", "philosophy", "essay"]
    weight: 0.5
  - label: "电影"
    keywords: ["film", "movie", "cinema", "导演", "影评", "Oscar", "电影节", "review", "票房", "选角", "剧本"]
    weight: 0.6
  - label: "书籍"
    keywords: ["book review", "novel", "literary", "读书", "书评", "fiction", "non-fiction", "出版", "author"]
    weight: 0.5
  - label: "心理学"
    keywords: ["psychology", "behavioral science", "cognitive", "decision making", "心理", "认知", "行为", "bias", "therapy", "mental"]
    weight: 0.6
  - label: "游戏折扣"
    keywords: ["Steam", "game deal", "discount", "free game", "sale", "折扣", "特惠", "indie game"]
    weight: 0.5

content_preferences:
  priority: "趣味性 > 严肃性"
  style: "洞见 > 信息量"
  scope: "跨学科关联 > 单一领域深钻"
  goal: "成为自由职业者"

# ─── 一手信源 (0-hop) ───

# arXiv: 原始论文
arxiv:
  categories: ["cs.AI", "cs.CL", "cs.LG", "cs.CV"]
  max_results: 20
  days_back: 3

# GitHub: 原始代码仓库
github_trending:
  focus: ["ai", "llm", "agent", "tool", "cli"]

# ─── 策展信源 (1-hop) ───

# HuggingFace: 社区策展论文
huggingface:
