<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Digest</title>
<style>
:root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --text-muted: #8b949e; --accent: #58a6ff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.container { text-align: center; padding: 40px; }
h1 { font-size: 28px; margin-bottom: 12px; }
h1 span { color: var(--accent); }
p { color: var(--text-muted); font-size: 15px; }
</style>
</head>
<body>
<div class="container">
    <h1><span>Daily</span> Digest</h1>
    <p>Your personalized daily content digest.</p>
    <p style="margin-top:8px;">Run <code>/digest</code> in Claude Code to generate today's digest.</p>
</div>
</body>
</html>
